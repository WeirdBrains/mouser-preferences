[package]
name = "mouser-preferences"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["Mouser Contributors"]
description = "Mouser's preferences mode as a plugin: every preference by section, edited through Mouser's prefs service"
repository = "https://github.com/WeirdBrains/mouser-preferences"
homepage = "https://github.com/WeirdBrains/mouser-preferences"
readme = "README.md"
keywords = ["terminal", "mouser", "preferences", "plugin"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/legacy"]

[dependencies]
mouser-mode-api = "0.1"
serde_json = "1.0.128"

[dev-dependencies]
tempfile = "3.10.1"

[lints.rust]
rust_2018_idioms = "warn"
unused_qualifications = "warn"
unexpected_cfgs = "warn"
