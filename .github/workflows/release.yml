name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }  # glibc 2.35: runs on older distros
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev libasound2-dev pkg-config cmake clang libclang-dev libvulkan-dev libgl1-mesa-dri libegl1
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eux
          T=${{ matrix.target }}; VER=${GITHUB_REF_NAME#v}
          S=stage; rm -rf $S; mkdir -p $S dist
          BIN=mouser-preferences; [ "${{ runner.os }}" = Windows ] && BIN=mouser-preferences.exe
          cp "target/$T/release/$BIN" "$S/"
          sed -e "s|\"./mouser-preferences\"|\"./$BIN\"|" plugin.toml > "$S/plugin.toml"
          cp LICENSE README.md "$S/"
          A=mouser-preferences-$VER-$T.tar.gz
          tar -C $S -czf "dist/$A" .
      - uses: actions/upload-artifact@v4
        with:
          name: mouser-preferences-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && for f in *.tar.gz; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done)

      - name: Sign (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is not set"; exit 1; }
          curl -sSfL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz | tar -xz -C "$RUNNER_TEMP"
          MS=$(find "$RUNNER_TEMP" -type f -name minisign -path '*x86_64*' | head -1)
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in dist/*; do
            case "$f" in *.sha256|*.minisig) continue;; esac
            printf '%s\n' "$MINISIGN_PASSWORD" | "$MS" -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "$(basename "$f") mouser-preferences ${GITHUB_REF_NAME}"
            "$MS" -V -p minisign.pub -m "$f"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
          cp minisign.pub dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="## [${GITHUB_REF_NAME#v}]" 'f && /^## \[/{exit} f{print} index($0,v)==1{f=1}' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
